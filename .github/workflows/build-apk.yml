name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Folder android/ dibuat otomatis, jadi repo cukup berisi lib/ dan pubspec.yaml
      - name: Generate platform Android
        run: flutter create . --platforms=android --org id.kantor --project-name inventaris_kantor

      - name: Ubah nama aplikasi
        run: sed -i 's/android:label="[^"]*"/android:label="Inventaris Kantor"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: inventaris-kantor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
